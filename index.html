<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Select | お気に入りの一着に出会おう</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #faf9f7;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", sans-serif;
    }

    header {
      background: white;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 27px;
      font-weight: 750;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 11px;
      color: #999;
      letter-spacing: 1px;
    }

    .hero {
      padding: 42px 20px;
      text-align: center;
      background: #f1e9e4;
    }

    .hero h1 {
      font-size: 22px;
      line-height: 1.6;
      margin: 0;
    }

    .hero p {
      font-size: 13px;
      color: #777;
      margin-bottom: 0;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 24px 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }

    select {
      width: 100%;
      min-width: 0;
      padding: 12px 5px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: white;
      font-size: 12px;
      color: #444;
    }

    .count {
      font-size: 13px;
      color: #888;
      margin-bottom: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .card {
      background: white;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .photo {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2ede9;
      font-size: 65px;
    }

    .info {
      padding: 13px;
    }

    .brand {
      font-size: 10px;
      color: #999;
      letter-spacing: 1px;
    }

    .name {
      font-size: 13px;
      margin: 8px 0;
      line-height: 1.5;
    }

    .price {
      font-size: 15px;
      font-weight: bold;
    }

    .size {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
    }

    .notice {
      margin-top: 30px;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.8;
    }

    footer {
      margin-top: 35px;
      padding: 25px;
      text-align: center;
      background: white;
      color: #aaa;
      font-size: 12px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }
      .photo {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">babyselect.</div>
  <div class="subtitle">LITTLE CLOTHES, BIG HAPPINESS.</div>
</header>

<section class="hero">
  <h1>小さな毎日に、<br>お気に入りの一着を。</h1>
  <p>かわいいベビー服との出会いを、もっと自由に。</p>
</section>

<main>

  <div class="filters">
    <select id="size">
      <option value="all">サイズ</option>
      <option value="60">60cm</option>
      <option value="70">70cm</option>
      <option value="80">80cm</option>
      <option value="90">90cm</option>
    </select>

    <select id="price">
      <option value="all">価格</option>
      <option value="2000">〜¥2,000</option>
      <option value="3000">〜¥3,000</option>
      <option value="5000">〜¥5,000</option>
    </select>

    <select id="category">
      <option value="all">カテゴリー</option>
      <option value="ロンパース">ロンパース</option>
      <option value="ワンピース">ワンピース</option>
      <option value="トップス">トップス</option>
      <option value="ボトムス">ボトムス</option>
    </select>
  </div>

  <div class="count" id="count"></div>
  <div class="products" id="products"></div>

  <p class="notice">
    ※現在は開発中のデモサイトです。<br>
    商品はサンプルで、実際の販売商品ではありません。
  </p>

</main>

<footer>
  © 2026 babyselect.
</footer>

<script>
  const items = [
    {
      name: "フリルロンパース",
      brand: "SAMPLE BRAND A",
      price: 1980,
      sizes: [60, 70, 80],
      category: "ロンパース",
      emoji: "🎀"
    },
    {
      name: "花柄ワンピース",
      brand: "SAMPLE BRAND B",
      price: 2980,
      sizes: [80, 90],
      category: "ワンピース",
      emoji: "🌸"
    },
    {
      name: "コットントップス",
      brand: "SAMPLE BRAND C",
      price: 1500,
      sizes: [70, 80, 90],
      category: "トップス",
      emoji: "🧸"
    },
    {
      name: "デニムパンツ",
      brand: "SAMPLE BRAND D",
      price: 2490,
      sizes: [80, 90],
      category: "ボトムス",
      emoji: "👖"
    },
    {
      name: "くまさんロンパース",
      brand: "SAMPLE BRAND E",
      price: 1800,
      sizes: [60, 70],
      category: "ロンパース",
      emoji: "🐻"
    },
    {
      name: "リボンワンピース",
      brand: "SAMPLE BRAND F",
      price: 3990,
      sizes: [80, 90],
      category: "ワンピース",
      emoji: "🎀"
    }
  ];

  const products = document.getElementById("products");
  const count = document.getElementById("count");

  function render() {
    const size = document.getElementById("size").value;
    const price = document.getElementById("price").value;
    const category = document.getElementById("category").value;

    const filtered = items.filter(item => {
      const sizeOK =
        size === "all" || item.sizes.includes(Number(size));

      const priceOK =
        price === "all" || item.price <= Number(price);

      const categoryOK =
        category === "all" || item.category === category;

      return sizeOK && priceOK && categoryOK;
    });

    count.textContent = filtered.length + " ITEMS";

    products.innerHTML = filtered.map(item => `
      <div class="card">
        <div class="photo">${item.emoji}</div>
        <div class="info">
          <div class="brand">${item.brand}</div>
          <div class="name">${item.name}</div>
          <div class="price">
            ¥${item.price.toLocaleString("ja-JP")}
          </div>
          <div class="size">
            SIZE ${item.sizes.join(" / ")}
          </div>
        </div>
      </div>
    `).join("");

    if (filtered.length === 0) {
      products.innerHTML =
        "<p>条件に合う商品がありません。</p>";
    }
  }

  document.querySelectorAll("select").forEach(select => {
    select.addEventListener("change", render);
  });

  render();
</script>

</body>
</html>
