<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baby Select | お気に入りの一着に出会おう</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f7;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:white;padding:22px 18px;text-align:center;border-bottom:1px solid #eee}
.logo{font-size:27px;font-weight:750;letter-spacing:2px}
.subtitle{margin-top:7px;font-size:11px;color:#999;letter-spacing:1px}
.hero{padding:42px 20px;text-align:center;background:#f1e9e4}
.hero h1{font-size:22px;line-height:1.6;margin:0}
.hero p{font-size:13px;color:#777;margin-bottom:0}
main{max-width:1000px;margin:auto;padding:24px 16px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
select{width:100%;min-width:0;padding:12px 5px;border:1px solid #ddd;border-radius:7px;background:white;font-size:12px;color:#444}
.count{font-size:13px;color:#888;margin-bottom:15px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:white;border-radius:9px;overflow:hidden;border:1px solid #eee;display:flex;flex-direction:column}
.photo{height:180px;display:flex;align-items:center;justify-content:center;background:#f2ede9}
.photo img{width:100%;height:100%;object-fit:contain}
.info{padding:13px;display:flex;flex-direction:column;flex:1}
.brand{font-size:10px;color:#999;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{font-size:13px;margin:8px 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:15px;font-weight:bold;margin-top:auto}
.shop-link{display:block;text-align:center;background:#eee2dc;color:#4d3f3b;border-radius:6px;padding:10px 4px;text-decoration:none;font-size:12px;font-weight:650;margin-top:12px}
.shop-link:active{opacity:.7}
.notice{margin-top:30px;text-align:center;color:#999;font-size:12px;line-height:1.8}
footer{margin-top:35px;padding:25px;text-align:center;background:white;color:#aaa;font-size:12px}
.message{grid-column:1/-1;font-size:13px;line-height:1.8;color:#777;text-align:center;padding:32px 10px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:220px}}
</style>
</head>
<body>
<header><div class="logo">babyselect.</div><div class="subtitle">LITTLE CLOTHES, BIG HAPPINESS.</div></header>
<section class="hero"><h1>小さな毎日に、<br>お気に入りの一着を。</h1><p>かわいいベビー服との出会いを、もっと自由に。</p></section>
<main>
<div class="filters">
<select id="size" aria-label="サイズ"><option value="all">サイズ</option><option value="60">60cm</option><option value="70">70cm</option><option value="80">80cm</option><option value="90">90cm</option></select>
<select id="price" aria-label="価格"><option value="all">価格</option><option value="2000">〜¥2,000</option><option value="3000">〜¥3,000</option><option value="5000">〜¥5,000</option></select>
<select id="category" aria-label="カテゴリー"><option value="all">カテゴリー</option><option value="ロンパース">ロンパース</option><option value="ワンピース">ワンピース</option><option value="トップス">トップス</option><option value="ボトムス">ボトムス</option></select>
</div>
<div class="count" id="count" aria-live="polite">商品を読み込み中…</div>
<div class="products" id="products"><p class="message">楽天の商品を読み込んでいます…</p></div>
<p class="notice">※開発中のサイトです。現在は楽天の検索結果から最大10件を表示しています。<br>サイズ・カテゴリーの判定は商品名に基づく簡易的なものです。<br>価格・在庫等は楽天の商品ページでご確認ください。</p>
</main>
<footer>© 2026 babyselect.</footer>
<script>
const API_URL = 'https://babyselect-api.emma-caroline-b.workers.dev/products';
const products = document.getElementById('products');
const count = document.getElementById('count');
let items = [];
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function isAllowedURL(url) {
  try { const u = new URL(url); return u.protocol === 'https:'; } catch { return false; }
}
function getCategory(name) {
  if (/ロンパース|カバーオール|ボディスーツ/.test(name)) return 'ロンパース';
  if (/ワンピース|ドレス/.test(name)) return 'ワンピース';
  if (/トップス|シャツ|トレーナー|ニット|セーター|ブラウス|Tシャツ/.test(name)) return 'トップス';
  if (/パンツ|ズボン|レギンス|スカート/.test(name)) return 'ボトムス';
  return '';
}
function sizesInName(name) {
  return [60,70,80,90].filter(size => new RegExp('(^|[^0-9])' + size + '(?:cm)?(?=[^0-9]|$)','i').test(name));
}
function render() {
  const size = document.getElementById('size').value;
  const price = document.getElementById('price').value;
  const category = document.getElementById('category').value;
  const filtered = items.filter(item => {
    if (size !== 'all' && !sizesInName(item.name).includes(Number(size))) return false;
    if (price !== 'all' && item.price > Number(price)) return false;
    if (category !== 'all' && getCategory(item.name) !== category) return false;
    return true;
  });
  count.textContent = filtered.length + ' ITEMS（取得した' + items.length + '件から絞り込み）';
  if (!filtered.length) {
    products.innerHTML = '<p class="message">条件に合う商品がありません。<br>別の条件を試してみてください。</p>';
    return;
  }
  products.innerHTML = filtered.map(item => {
    const safeImage = isAllowedURL(item.image) ? escapeHTML(item.image) : '';
    const safeLink = isAllowedURL(item.url) ? escapeHTML(item.url) : '';
    return `<article class="card">
      <div class="photo">${safeImage ? `<img src="${safeImage}" alt="${escapeHTML(item.name)}" loading="lazy" referrerpolicy="no-referrer">` : '🧸'}</div>
      <div class="info">
        <div class="brand">${escapeHTML(item.shop || '楽天市場')}</div>
        <div class="name">${escapeHTML(item.name)}</div>
        <div class="price">¥${Number(item.price).toLocaleString('ja-JP')}</div>
        ${safeLink ? `<a class="shop-link" href="${safeLink}" target="_blank" rel="noopener noreferrer sponsored">楽天で見る ↗</a>` : ''}
      </div></article>`;
  }).join('');
}
async function loadProducts() {
  try {
    const response = await fetch(API_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('API error: ' + response.status);
    const data = await response.json();
    if (!Array.isArray(data.items)) throw new Error('Unexpected response');
    items = data.items.filter(i => i && i.name && Number.isFinite(Number(i.price))).map(i => ({
      name:String(i.name), price:Number(i.price), image:String(i.image||''), url:String(i.url||''), shop:String(i.shop||'')
    }));
    render();
  } catch (error) {
    count.textContent = '読み込みエラー';
    products.innerHTML = '<p class="message">商品を読み込めませんでした。<br>少し時間をおいて、ページを再読み込みしてください。</p>';
    console.error(error);
  }
}
document.querySelectorAll('select').forEach(select => select.addEventListener('change', render));
loadProducts();
</script>
</body>
</html>
